# CI of R-025 (docs/ci.md, T-022). Started only by manual dispatch, from tools/agent-workflow/ci_window.py inside the
# visibility window, so a push never starts a run while the repository is private (decisions 26, 112).
# Both legs run every test; nothing is skipped, deselected or allowed to fail (T-022 PM approval point 2).
# Action pins: full commit SHAs of the latest releases, read by the PM from the official repositories with
# `gh api repos/actions/<name>/releases/latest` and `.../git/ref/tags/<tag>` on 2026-11-15 16:12 (docs/ci.md);
# ci_window.py refuses to open while any `uses:` is not a full SHA.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # One job per suite, in parallel: run 43820753462 ran both suites in one Windows job, and the pipeline suite
        # alone took 23 min 27 s there, so the 30 min limit cancelled the tooling suite after 1018 tests in 355 s.
        suite: [pipeline, tooling]
    runs-on: ${{ matrix.os }}
    # Below ci_window_config.json run_timeout_seconds (4200 s). PM value pending user review: the Windows tooling
    # suite is estimated at about 37 min from that partial run (6360 tests at its rate), so 60 min leaves a margin.
    timeout-minutes: 60
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tests need no authenticated git; v7 README: "Set `persist-credentials: false` to opt-out."
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # artifact-bound: the dev machine runs 3.12.10; .agents/project.json python.min_version is 3.11
          python-version: "3.12"
      - name: Install the CPU profile (pyproject dependencies and the test extra; no GPU package)
        run: python -m pip install ".[test]"
      # Each job runs exactly the suite its matrix entry names; together the four jobs run both suites on both systems.
      # A suite value matching no step fails here, so a misspelled entry can never pass without running tests
      # (S42-ci5 review F1). The value comes in through the environment, not into the script text.
      - name: Refuse an unknown suite
        if: ${{ matrix.suite != 'pipeline' && matrix.suite != 'tooling' }}
        env:
          SUITE: ${{ matrix.suite }}
        run: python -c "import os, sys; sys.exit('unknown matrix suite ' + os.environ['SUITE'])"
      - name: Pipeline suite
        if: ${{ matrix.suite == 'pipeline' }}
        env:
          PYTHONPATH: src
        run: python -B -X faulthandler -m pytest -q -p no:cacheprovider tests
      # S42-ci7: CI window 7 saw one child abort at interpreter exit ("terminate called without an active exception")
      # after an in-memory Parquet read. The abort was rare upstream (2/300 to 38/3000 processes), so this Linux-only
      # opt-in check spawns 1000 short children that each read a manifest and exit; the default suite skips it.
      - name: Exit stress after an in-memory Parquet read (Linux)
        if: ${{ matrix.suite == 'pipeline' && runner.os == 'Linux' }}
        env:
          PYTHONPATH: src
          PE_EXIT_STRESS: "1000"
        run: python -B -X faulthandler -m pytest -q -p no:cacheprovider tests/test_storage_concurrency.py::test_child_reading_a_manifest_exits_cleanly_many_times
      - name: Tooling suite
        if: ${{ matrix.suite == 'tooling' }}
        run: python -B -X faulthandler -m pytest -q -p no:cacheprovider tools/agent-workflow/tests
