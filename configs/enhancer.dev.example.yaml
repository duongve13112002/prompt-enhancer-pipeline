# Dev-machine profile: extends the full profile and overrides only what differs. Built and tested on the CPU with labelled doubles; values stay sentinels until fitted. How to run: docs/run-guide.md.
# Everything must work here first (R-020, decision 20). Dev results show that the code works; they never fit a sentinel
# and never support a timing claim. The quantisation file below is a profile value: change it per run (experiment E15, N123).
schema_version: 2
extends: enhancer.example.yaml
status: template
purpose: smoke

validation:
  verifier:
    calibration_ref: fit_from_gt          # inherited contract; dev smoke never fits calibration
    require_calibration: false

aliases:
  languages: [vi, en, ja, zh]              # decision 135: explicit dev targets, passed to the prompt as data

observe:
  near_duplicate_cosine_distance: fit_from_gt   # E14; a smoke run never fits this value

sync:
  retained_images: {max_image_bytes: 16777216, max_total_bytes: 1073741824}  # dev-only smoke bounds (16 MiB, 1 GiB), not measured

knowledge:
  root: database                         # the dev machine's knowledge base (decision 61): Git-ignored, read only

evaluation:
  # `eval run` and `eval import` dev values (T-016 P4): dev-only, none measured, none fitted. 8 MiB is far above the 55-record
  # draft set (a few hundred KiB); the source-image bound is the 16 MiB retained-image bound above; 2 scenarios in flight
  # in total, both retrieval variants together, is a small smoke value, the dev backend serves one request at a time
  # through its own max_concurrency of 1; 64 MiB for any file under eval/runs/ is far above a pack of 55 scenarios;
  # scale 1 to 5 is an example; `qwen` is an example family identifier (the dev model's family), a deployment declares
  # its own.
  run: {max_set_bytes: 8388608, max_source_image_bytes: 16777216, max_concurrency: 2, max_sidecar_bytes: 67108864}
  judge: {blinding_seed: 20261119, score_min: 1, score_max: 5, under_test_families: [qwen], max_score_file_bytes: 1048576}

serving:
  # dev-only smoke bound, not measured, and a proxy: `request.v0` has no length limit on `source_image` or `prompt`, so no
  # request bound exists to derive it from. It is 22 MiB = the base64 form (22369624 B) of the 16 MiB retained-image bound
  # `sync.retained_images.max_image_bytes` above, plus about 0.66 MiB of slack for the prompt and overrides. A deployment
  # sets its own value.
  # `enhance serve` dev smoke values (T-016 P3), all dev-only and none measured. No existing dev limit bounds a socket or
  # a timer (every comparable timer of this profile is `deploy_required`), so they are small round values with a stated
  # meaning: loopback only, port 8765 an example; 4 connections hold one request in flight (the dev VLM backend, under
  # `vlm.backends.main` below, serves one request at a time through its own `max_concurrency` of 1), one queued request
  # and two more that are turned away with 503 (the service's own `serving.max_concurrency` stays unresolved, see the
  # last sentence; `max_connections` must hold `serving.max_concurrency + serving.queue_limit`); 10 s to read a request (the
  # largest request, max_request_bytes above, is read from loopback in well under that), 10 s per write, and 10 s for a
  # stop to wait for running requests. `max_concurrency`, `queue_limit` and `total_deadline_s` stay unresolved above.
  host: 127.0.0.1
  port: 8765
  http: {max_request_bytes: 23068672, max_connections: 4, read_timeout_s: 10, write_timeout_s: 10, shutdown_timeout_s: 10}

runtime:
  request_deadline_s: fit_from_bench
  trace: {retention_s: deploy_required, queue_limit: deploy_required, workers: deploy_required, drain_timeout_s: deploy_required}
  monitoring: {queue_limit: deploy_required, workers: deploy_required, drain_timeout_s: deploy_required}
  intake_deadline_s: fit_from_bench        # No measured intake deadline yet
  gpus: [0]
  vram_budget_gb: 7                      # the user's dev GPU, decision 20: nvidia-smi reports 8151 MiB in total (T-018 P2), below 8 GiB, so 8 is refused at load

candidates:
  sources:
    alias: {enabled: true, depth: fit_from_gt}
    lexical: {enabled: true, depth: fit_from_gt}
    dense: {enabled: true, depth: fit_from_gt}
  rrf_constant: fit_from_gt
  max_prompt_windows: fit_from_bench

vision:
  max_decode_pixels: deploy_required      # No measured dev decode limit; independent of VLM backend limits
  max_image_side: 1024                   # decision 84: experiments and benchmarks keep the longer side at 1024 (aspect ratio kept, no upscale)

request_overrides:
  allowed_keys: []

embedding:
  query_text_template: design_required   # E5 supplies the query prefix independently of the document prefix
  chosen: embeddinggemma-2             # N104; the smoke choice for the dev machine, small enough to share the dev GPU; experiment E5 chooses for the full profile
  backend: embedder                      # T-018: this project's embedding server on the original weights (decisions 137 to 139); the Qwen3-VL-Embedding-2B comparison selects embedder_qwen3vl2b through enhancer.dev-qwen3vl2b.example.yaml
  revision: f9972ac22e696a105c482202646979e33e4b5a1e   # must equal the backend's model.revision
  request:                               # EmbeddingGemma 2: no system instruction (N104); the document prefix is the card's `Document` prompt
    shape: openai_input_content
    image_instruction: none
    extra_body: {}
    text_template: "title: none | text: {text}"
  dimension: 768                         # native output dimension, N104
  dimension_mode: native
  batch_size: 8                          # a profile value for the dev GPU [P]

vlm:
  backends:
    main:
      provider: openai_compatible        # llama-server speaks the OpenAI style, N055
      engine: {name: llama_cpp, version: pin_required}
      unsupported_param_policy: warn
      base_urls: [deploy_required]       # a loopback URL of the local server, set per machine
      api_key_file: none
      model:
        id: Qwen3.5-4B
        source: unsloth/Qwen3.5-4B-GGUF  # N056
        file: Qwen3.5-4B-Q3_K_M.gguf     # decision 20; 2.29 GB, N103
        mmproj_file: mmproj-F16.gguf     # N103
        revision: pin_required
      max_concurrency: 1
      http: {connect_timeout_s: deploy_required, read_timeout_s: deploy_required, write_timeout_s: deploy_required, pool_timeout_s: deploy_required, max_retries: design_required, backoff_initial_s: design_required, backoff_max_s: design_required, retry_statuses: design_required}
      probe: {max_requests: design_required, timeout_s: design_required, image_attempts: fit_from_bench}
      image: {max_decode_pixels: deploy_required, max_side: none}
    embedder:                            # K1 embedding server: EmbeddingGemma 2 from its original weights (T-018); the weights sit under models/ and are verified against models/manifest.json
      provider: openai_compatible
      engine: {name: embed_server, version: pin_required}   # python -m prompt_enhancer.embed_server serve, run in .venv-gpu
      unsupported_param_policy: warn
      base_urls: [deploy_required]       # a loopback http URL with an explicit port, set per machine
      api_key_file: none
      model: {id: google/embeddinggemma-2, revision: f9972ac22e696a105c482202646979e33e4b5a1e, source: none, file: none, mmproj_file: none}   # N104; revision from the Hub, read 2026-11-16
      max_concurrency: 1
      http: {connect_timeout_s: deploy_required, read_timeout_s: deploy_required, write_timeout_s: deploy_required, pool_timeout_s: deploy_required, max_retries: design_required, backoff_initial_s: design_required, backoff_max_s: design_required, retry_statuses: design_required}
      probe: {max_requests: design_required, timeout_s: design_required, image_attempts: fit_from_bench}   # unused by K1; required by the backend schema
      image: {max_decode_pixels: deploy_required, max_side: none}
      endpoints: {embeddings: v1/embeddings, health: health}
      server:                            # T-018; every key is a profile value, the server has no defaults
        family: embedding_gemma2
        dtype: bfloat16                  # card: "Run inference in bfloat16 or float32. Do not use float16." (N104)
        attn_implementation: deploy_required   # EmbeddingGemma 2: eager only; sdpa is refused when the profile is read (its audio tower, Gemma4AudioModel, has no SDPA path in transformers 5.23.0; families.attn_implementations, T-018 P2)
        forward_batch: deploy_required   # images per forward pass, at most embedding.batch_size; VRAM measured in P2
        max_length: 8192                 # card: "a single shared 8,192-token context"
        image: {min_pixels: none, max_pixels: none, max_soft_tokens: 280}   # processor_config.json default; the card allows 70 to 1120
        default_instruction: none
        idle_exit_s: deploy_required     # seconds without a request before the server exits; 0 = never
        max_request_bytes: deploy_required
        max_image_bytes: deploy_required
        max_pending_requests: deploy_required   # admitted POSTs at once (body read, decode, GPU wait); more get 503
        max_connections: deploy_required   # accepted sockets and handler threads at once, at least max_pending_requests; more are turned away
        max_discard_bytes: deploy_required   # most bytes read and dropped after a refusal, at least max_request_bytes
        read_timeout_s: deploy_required   # one deadline per connection for the whole request; also the reply send timeout
        reference_check:                 # read by `reference-check compare` only; dev values (smoke only, never a deployment threshold), summarised in tasks/active/T-018-embedding-server.md
          min_cosine: 0.9998             # T-018 P2 fit on the dev machine: the lowest cosine across the card recipe's bf16/float32, batch 1/2/4, forward/reversed runs (0.99987), floored to 4 decimals; evidence runs/T-018-p2/eg2/reference/fit.json
          max_norm_deviation: 0.0016     # T-018 P2 fix round 1: the largest |norm - 1| of the same 12 recipe runs' 48 vectors (0.0015440, the card recipe normalises in bf16), rounded up to 4 decimals; recomputed on the CPU from runs/T-018-p2/eg2/reference/reference.json
    embedder_qwen3vl2b:                  # the second dev embedder for the accuracy comparison (decision 137); selected by enhancer.dev-qwen3vl2b.example.yaml
      provider: openai_compatible
      engine: {name: embed_server, version: pin_required}
      unsupported_param_policy: warn
      base_urls: [deploy_required]       # another loopback port than embedder, set per machine
      api_key_file: none
      model: {id: Qwen/Qwen3-VL-Embedding-2B, revision: 9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda, source: none, file: none, mmproj_file: none}   # N105; revision from the Hub, read 2026-11-16
      max_concurrency: 1
      http: {connect_timeout_s: deploy_required, read_timeout_s: deploy_required, write_timeout_s: deploy_required, pool_timeout_s: deploy_required, max_retries: design_required, backoff_initial_s: design_required, backoff_max_s: design_required, retry_statuses: design_required}
      probe: {max_requests: design_required, timeout_s: design_required, image_attempts: fit_from_bench}
      image: {max_decode_pixels: deploy_required, max_side: none}
      endpoints: {embeddings: v1/embeddings, health: health}
      server:
        family: qwen3_vl_embedding
        dtype: bfloat16
        attn_implementation: deploy_required
        forward_batch: deploy_required
        max_length: 8192                 # MAX_LENGTH of the card's scripts/qwen3_vl_embedding.py
        image: {min_pixels: 4096, max_pixels: 1310720, max_soft_tokens: none}   # preprocessor_config.json at the pinned revision (size.longest_edge 1310720, shortest_edge 4096), the limits the card's sentence-transformers recipe uses; the card script's MAX_PIXELS 1800*32*32 differs (T-018 P2 stage B)
        default_instruction: Represent the user's input.   # card: the default system instruction of every input
        idle_exit_s: deploy_required
        max_request_bytes: deploy_required
        max_image_bytes: deploy_required
        max_pending_requests: deploy_required   # admitted POSTs at once (body read, decode, GPU wait); more get 503
        max_connections: deploy_required   # accepted sockets and handler threads at once, at least max_pending_requests; more are turned away
        max_discard_bytes: deploy_required   # most bytes read and dropped after a refusal, at least max_request_bytes
        read_timeout_s: deploy_required   # one deadline per connection for the whole request; also the reply send timeout
        reference_check:                 # read by `reference-check compare` only; dev values (smoke only, never a deployment threshold), summarised in tasks/active/T-018-embedding-server.md
          min_cosine: 0.9996             # T-018 P2 fit on the dev machine: the lowest cosine across the card recipe's bf16 batch 1/2/4, forward/reversed runs (0.99970), floored to 4 decimals; evidence runs/T-018-p2/qwen/reference/fit.json
          max_norm_deviation: 0.0023     # T-018 P2 fix round 1: the largest |norm - 1| of the same 6 recipe runs' 24 vectors (0.0022919), rounded up to 4 decimals; recomputed on the CPU from runs/T-018-p2/qwen/reference/reference.json
