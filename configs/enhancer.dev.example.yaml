# Dev-machine profile: extends the full profile and overrides only what differs. Documentation only; nothing is implemented.
# Everything must work here first (R-020, decision 20). Dev results show that the code works; they never fit a sentinel
# and never support a timing claim. The quantisation file below is a profile value: change it per run (experiment E15, N123).
schema_version: 1
extends: enhancer.example.yaml
status: template
purpose: smoke

knowledge:
  root: database                         # the dev machine's knowledge base (decision 61): Git-ignored, read only

runtime:
  gpus: [0]
  vram_budget_gb: 8                      # the user's dev GPU, decision 20; a profile value

vision:
  max_image_side: 1024                   # decision 84: experiments and benchmarks keep the longer side at 1024 (aspect ratio kept, no upscale)

embedding:
  chosen: embeddinggemma-2              # N104; the smoke choice for the dev machine, small enough to share the dev GPU; experiment E5 chooses for the full profile
  backend: embedder                      # [A] no primary source yet confirms EmbeddingGemma 2 image embedding on llama.cpp (T-008 Step 0, A1-A3)
  dimension: 768                         # native output dimension, N104
  dimension_mode: native
  batch_size: 8                          # a profile value for the dev GPU [P]

vlm:
  backends:
    main:
      provider: openai_compatible        # llama-server speaks the OpenAI style, N055
      engine: {name: llama_cpp, version: pin_required}
      unsupported_param_policy: warn
      base_urls: [deploy_required]       # a loopback URL of the local server, set per machine
      api_key_file: none
      model:
        id: Qwen3.5-4B
        source: unsloth/Qwen3.5-4B-GGUF  # N056
        file: Qwen3.5-4B-Q3_K_M.gguf     # decision 20; 2.29 GB, N103
        mmproj_file: mmproj-F16.gguf     # N103
        revision: pin_required
      max_concurrency: 1
      http: {connect_timeout_s: deploy_required, read_timeout_s: deploy_required, write_timeout_s: deploy_required, pool_timeout_s: deploy_required, max_retries: design_required, backoff_initial_s: design_required, backoff_max_s: design_required, retry_statuses: design_required}
      probe: {max_requests: design_required, timeout_s: design_required}
      image: {max_decode_pixels: deploy_required}
    embedder:                            # K1 embedding server (llama-server with --embedding and --mmproj, N055); T-008
      provider: openai_compatible
      engine: {name: llama_cpp, version: pin_required}
      unsupported_param_policy: warn
      base_urls: [deploy_required]       # a loopback URL of the local embedding server, set per machine
      api_key_file: none
      model: {id: deploy_required, revision: pin_required, source: none, file: none, mmproj_file: none}
      max_concurrency: 1
      http: {connect_timeout_s: deploy_required, read_timeout_s: deploy_required, write_timeout_s: deploy_required, pool_timeout_s: deploy_required, max_retries: design_required, backoff_initial_s: design_required, backoff_max_s: design_required, retry_statuses: design_required}
      probe: {max_requests: design_required, timeout_s: design_required}   # unused by K1; required by the backend schema
      image: {max_decode_pixels: deploy_required}
      endpoints: {embeddings: v1/embeddings, health: health}
