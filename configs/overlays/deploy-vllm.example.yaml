# Overlay for the production deployment: a vLLM-style server the user runs. Built and tested on the CPU with labelled doubles; values stay sentinels until fitted. How to run: docs/run-guide.md.
# Applied over configs/enhancer.example.yaml. The user deploys and runs the server; the agent never starts the production
# server and only writes the run guide. Facts: decision 20, N102, N121, N057.
schema_version: 1
overlay_of: ../enhancer.example.yaml
status: template

vlm:
  backends:
    main:
      provider: openai_compatible        # N057
      engine: {name: vllm, version: pin_required}
      base_urls: [deploy_required]
      model:
        id: Qwen/Qwen3.8-27B-FP8         # decision 20: the BF16 weights (about 55.6 GB) do not fit a 45 to 48 GB card; FP8 is about 30.9 GB on disk, N102
        revision: pin_required
      extra_body:
        chat_template_kwargs: {enable_thinking: false}   # thinking is on by default, so every request switches it off, N102, N121
      max_concurrency: fit_from_bench
      http: {connect_timeout_s: deploy_required, read_timeout_s: deploy_required, write_timeout_s: deploy_required, pool_timeout_s: deploy_required, max_retries: design_required, backoff_initial_s: design_required, backoff_max_s: design_required, retry_statuses: design_required}
      probe: {max_requests: design_required, timeout_s: design_required, image_attempts: fit_from_bench}
      image: {max_decode_pixels: deploy_required, max_side: none}   # max_side: the server's own longest-side cap, decision 144
      addendum_layout: deploy_required   # T017-FIX: set from the served model's chat template; Qwen-family templates refuse a second system message (J4a2 call 18), which needs joined_system_message
      addendum_separator: deploy_required   # a non-empty string with joined_system_message; none with separate_system_message (decision 193)
      endpoints:
        chat: deploy_required
        health: deploy_required

runtime:
  gpus: auto
  vram_budget_gb: deploy_required
  cpu_workers: auto

storage:
  lock: {timeout_s: deploy_required, poll_s: deploy_required}   # store lock wait, set per machine (T-006)

serving:
  max_concurrency: fit_from_bench
  queue_limit: design_required
  total_deadline_s: fit_from_bench
  host: deploy_required
  port: deploy_required
  http:
    max_request_bytes: deploy_required   # set per deployment: the largest source image as base64 plus the prompt
    max_connections: deploy_required
    read_timeout_s: deploy_required
    write_timeout_s: deploy_required
    shutdown_timeout_s: deploy_required
