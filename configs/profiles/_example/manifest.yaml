# Example admin profile manifest for system_prompt.txt. Documentation only; nothing is implemented.
# Drafted by a model at registration and confirmed by the admin (decision 6). The system prompt text is never edited.
# Shape: contracts/schemas/profile_manifest.v0.schema.json. Meaning of each field: docs/stages/P-profiles.md.
schema_version: 1
profile_id: _example
status: draft                           # draft | confirmed | active; only the admin confirms
system_prompt_hash: computed_at_registration   # hash of system_prompt.txt, written by `profile register`
template_format: sectioned              # [P] sectioned | plain. [SYSTEM] is the system message verbatim, [USER] the user-turn template
meta:                                   # [P] the [META] section, recorded here; mapped to a runtime parameter only when the backend supports it
  frozen: false
  thinking_mode: disabled               # a thinking switch, sent only if the backend has one
supported_tasks: [generate]             # decision 5: an edit request to this profile is refused
output_kind: json                       # the system prompt describes the object: two top-level keys, single-line minified
output_schema_id: none                  # no schema file yet; the admin may add one under contracts/schemas/
output_language: english                # prose fields; text to render stays verbatim
edit_output_semantics: none             # generate-only profile
template_variables: [original_prompt]   # the input variable of the [USER] section
quote_semantics: literal_text           # a quoted string in the input becomes a text element, so a brief puts no quotes around concept names
renderer:
  accepts_reference_images: false
  image_reference_syntax: none
validator:
  checks:
    - single_line_minified_json
    - word_caps_as_listed_in_the_prompt   # the prompt states its own caps for the summary and each element description
    - bbox_range_0_to_1000_when_present
conflicts:                              # found by `profile check`; each needs the admin's decision before activation
  - id: c1
    profile_rule: "Populate underspecified scenes"
    conflicts_with: "creativity limits (creativity.allowed_additions, creativity.max_new_entities)"
    decision: undecided
    decided_by_admin: false
  - id: c2
    profile_rule: "Built environments need text everywhere"
    conflicts_with: "a user's request for no text"
    decision: undecided
    decided_by_admin: false
  - id: c3
    profile_rule: "Banned hedge phrasings / pick one and commit"
    conflicts_with: "leaving out identity facts that have no evidence"
    decision: undecided
    decided_by_admin: false
  - id: c4
    profile_rule: "Quoted strings become text elements"
    conflicts_with: "quoted names in structured input"
    decision: undecided
    decided_by_admin: false
golden_tests: []                        # test case ids that must pass before activation
