# Example admin profile manifest for system_prompt.txt (the user's admin prompt `v1`, decision 70). Built and tested on the CPU with labelled doubles; an example only, not a deployment profile. How to run: docs/run-guide.md.
# Drafted by a model at registration and confirmed by the admin (decision 6). The system prompt text is never edited.
# Shape: contracts/schemas/profile_manifest.v1.schema.json (schema_version 2; a schema_version 1 manifest is profile_manifest.v0 and still loads for one source image). Meaning of each field: docs/stages/P-profiles.md.
schema_version: 2
profile_id: _example
status: draft                           # draft | confirmed | active; only the admin confirms
system_prompt_hash: computed_at_registration   # hash of system_prompt.txt, written by `profile register`
template_format: sectioned              # [P] sectioned | plain. [SYSTEM] is the system message verbatim, [USER] the user-turn template
meta:                                   # [P] the [META] section, recorded here; mapped to a runtime parameter only when the backend supports it
  frozen: false                         # meaning not stated by the prompt; recorded only
  thinking_mode: disabled               # a thinking switch, sent only if the backend has one
supported_tasks: [generate, edit]       # decision 70: one prompt for both tasks
output_kind: json                       # the system prompt describes the object: three top-level keys (aspect_ratio, high_level_description, compositional_deconstruction), single-line minified
output_schema_id: none                  # no schema file yet; the admin may add one under contracts/schemas/
output_language: English                # decision 67: the prompt states it (prose in English; the `text` field keeps the user's characters)
edit_output_semantics: whole_edited_image   # decision 73: the JSON describes the whole edited image; unchanged parts as in the source image
template_variables: [aspect_ratio, original_prompt]   # the [USER] section; the aspect-ratio and bbox parts are a temporary example and ignored (decision 70); R-005 stands
template_values:                         # decision 81: fixed values for variables other than the input variable
  aspect_ratio: auto
quote_semantics: literal_text           # a quoted string in the input becomes a text element, so a brief puts no quotes around concept names
renderer:                               # decision 179: two numbered image groups, each counted from 1; a syntax is `none` or a string with exactly one {n} (for example "<source_{n}>")
  accepts_reference_images: false
  max_source_images: 1                  # how many source images the image model accepts in one edit (the admin confirms the drafted number)
  source_image_syntax: none             # none is allowed only with max_source_images 1
  reference_image_syntax: none          # none is required while accepts_reference_images is false
validator:
  checks:
    - single_line_minified_json
    - top_level_keys_in_order_as_listed_in_the_prompt
    - word_caps_as_listed_in_the_prompt   # the prompt states its own caps for the summary and each element description
    - bbox_range_0_to_1000_when_present
conflicts:                              # found by `profile check`; each needs the admin's decision before activation
  - id: c1
    profile_rule: "Populate underspecified scenes"
    conflicts_with: "creativity limits (creativity.allowed_additions, creativity.max_new_entities)"
    config_keys: [creativity.allowed_additions, creativity.max_new_entities]
    decision: undecided
    decided_by_admin: false
  - id: c2
    profile_rule: "Built environments need text everywhere"
    conflicts_with: "a user's request for no text"
    config_keys: [creativity.max_added_text_blocks]
    decision: undecided
    decided_by_admin: false
  - id: c3
    profile_rule: "Banned hedge phrasings / pick one and commit"
    conflicts_with: "leaving out identity facts that have no evidence"
    config_keys: []                     # a fixed pipeline rule, not a configuration key
    decision: undecided
    decided_by_admin: false
  - id: c4
    profile_rule: "Quoted strings become text elements"
    conflicts_with: "quoted names in structured input"
    config_keys: []                     # a fixed pipeline rule, not a configuration key
    decision: undecided
    decided_by_admin: false
golden_tests: []                        # test case ids that must pass before activation
